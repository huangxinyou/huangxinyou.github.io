<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专题成绩表</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .hero {
            min-height: 100vh;
            animation: bgFlow 10s ease-in-out infinite alternate;
        }
        @keyframes bgFlow {
            0% { background-position: 0% 0%, 0% 0%, 0% 0%; }
            25% { background-position: 0% 0%, 0% 0%, 100% 0%; }
            50% { background-position: 0% 0%, 0% 0%, 100% 100%; }
            75% { background-position: 0% 0%, 0% 0%, 0% 100%; }
            100% { background-position: 0% 0%, 0% 0%, 50% 50%; }
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            table-layout: auto
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
        }
        th {
            background: #2d3748;
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
        }
        tr:hover {
            background: #f7fafc;
        }
        td a {
            color: #2d3748;
            text-decoration: none;
            font-weight: 500;
        }
        td a:hover {
            text-decoration: underline;
            color: #1a202c;
        }
        td span {
            font-weight: 600;
        }
        h1 {
            color: white;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .score_10 { color: forestgreen; }
        .score_9  { color: #34d034; }
        .score_8  { color: #41f741; }
        .score_7  { color: #52ff00; }
        .score_6  { color: #a5ff00; }
        .score_5  { color: #c8ff00; }
        .score_4  { color: #ffd800; }
        .score_3  { color: #ffa900; }
        .score_2  { color: #ff6200; }
        .score_1  { color: #ff4b00; }
        .score_0  { color: red; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hero = document.querySelector('.hero');
            if (hero) {
                const randomHSL = (alpha = 1) => {
                    const h = Math.floor(Math.random() * 360);
                    const s = 40 + Math.floor(Math.random() * 41);
                    const l = 50 + Math.floor(Math.random() * 31);
                    return alpha >= 1 ? `hsl(${h}, ${s}%, ${l}%)` : `hsla(${h}, ${s}%, ${l}%, ${alpha})`;
                };
                const colorCount = 10 + Math.floor(Math.random() * 6);
                const colors = [];
                for (let i = 0; i < colorCount; i++) colors.push(randomHSL(1));
                const angle = Math.floor(Math.random() * 360);
                const bg = `
                    radial-gradient(ellipse at ${10+Math.random()*80}% ${10+Math.random()*80}%, ${randomHSL(0.25)} 0%, transparent 50%),
                    radial-gradient(ellipse at ${10+Math.random()*80}% ${10+Math.random()*80}%, ${randomHSL(0.25)} 0%, transparent 50%),
                    linear-gradient(${angle}deg, ${colors.join(', ')})
                `.trim();
                hero.style.background = bg;
                hero.style.backgroundSize = '100% 100%, 100% 100%, 600% 600%';
            }
        });
    </script>
</head>
<body class="hero font-sans antialiased text-gray-800 py-10">
    <div class="container">
        <h1 class="text-3xl font-bold">🏆 专题（ACM）成绩表</h1>
        <table>
            <thead>
                <tr>
                    <th>📅 专题（日期）</th>
                    <th>📊 题数</th>
                    <th>🏅 排名</th>
                    <th>📝 补题</th>
                </tr>
            </thead>
            <tbody>
                 <!-- <tr>
                     <td><a href="http://nflsoi.cc:20035/c/2505" target="_blank">好题选讲（20260620）</a></td>
                     <td><span class="score_6">4/6</span></td>
                     <td>25</td>
                     <td><span class="score_10">6/6</span></td>
                 </tr> -->
            </tbody>
        </table>
    </div>
</body>
</html>
