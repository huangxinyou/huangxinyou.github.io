<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合成绩表</title>
    <!-- 保留你原来的 Tailwind 和 Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== 完全沿用你 IOI 页面的样式（背景由 JS 动态生成） ===== */
        .hero {
            min-height: 100vh;
            /* 背景将在 JS 中设置，此处留空 */
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
        }

        th {
            background: #2d3748;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        tr:hover {
            background: #f7fafc;
        }

        td a {
            color: #2d3748;
            text-decoration: none;
            font-weight: 500;
        }
        td a:hover {
            text-decoration: underline;
            color: #1a202c;
        }
        td span {
            font-weight: 600;
        }
        td:last-child {
            font-weight: 600;
            color: #2d3748;
        }

        h1 {
            color: white;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .section {
            margin-top: 2.5rem;
        }
        .section h2 {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 0.5rem;
        }

        /* 分数颜色类（完全照搬） */
        .score_10 { color: forestgreen; }
        .score_9  { color: #34d034; }
        .score_8  { color: #41f741; }
        .score_7  { color: #52ff00; }
        .score_6  { color: #a5ff00; }
        .score_5  { color: #c8ff00; }
        .score_4  { color: #ffd800; }
        .score_3  { color: #ffa900; }
        .score_2  { color: #ff6200; }
        .score_1  { color: #ff4b00; }
        .score_0  { color: red; }

        /* 加载/错误信息样式 */
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 2rem 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        .error {
            color: #fee2e2;
            background: rgba(220, 38, 38, 0.3);
            padding: 0.75rem;
            border-radius: 6px;
            text-align: center;
        }
        .hero {
            min-height: 100vh;
            animation: bgFlow 10s ease-in-out infinite alternate;
        }

        /* 核心流动动画：让大渐变在背景中缓慢漂移 */
        @keyframes bgFlow {
            0% {
                /* 径向光晕1固定，径向光晕2固定，线性渐变起始位置 */
                background-position: 0% 0%, 0% 0%, 0% 0%;
            }
            25% {
                background-position: 0% 0%, 0% 0%, 100% 0%;
            }
            50% {
                background-position: 0% 0%, 0% 0%, 100% 100%;
            }
            75% {
                background-position: 0% 0%, 0% 0%, 0% 100%;
            }
            100% {
                background-position: 0% 0%, 0% 0%, 50% 50%;
            }
        }
    </style>\
          <script>
        /**
         * 生成完全随机的 HSL 颜色（带透明度可选）
         * 色相 0~360，饱和度 40%~80%，明度 50%~80%，色调柔和明亮
         */
        function randomHSL(alpha = 1) {
            const h = Math.floor(Math.random() * 360);
            const s = 40 + Math.floor(Math.random() * 41);  // 40~80
            const l = 50 + Math.floor(Math.random() * 31);  // 50~80
            if (alpha >= 1) return `hsl(${h}, ${s}%, ${l}%)`;
            return `hsla(${h}, ${s}%, ${l}%, ${alpha})`;
        }

        /**
         * 生成完全随机的背景样式（三层叠加）
         * - 两层径向光晕：位置、颜色、透明度均随机
         * - 一层线性渐变：颜色数量 3~8 种，角度 0~360° 随机
         */
        function generateRandomBackground() {
            // 光晕1：随机位置 (10%~90%)
            const x1 = 10 + Math.random() * 80;
            const y1 = 10 + Math.random() * 80;
            // 光晕2
            const x2 = 10 + Math.random() * 80;
            const y2 = 10 + Math.random() * 80;

            const glow1 = randomHSL(0.20 + Math.random() * 0.15);
            const glow2 = randomHSL(0.20 + Math.random() * 0.15);

            // 随机决定渐变颜色数量（3~8种）
            const colorCount = 10 + Math.floor(Math.random() * 6);
            const colors = [];
            for (let i = 0; i < colorCount; i++) {
                colors.push(randomHSL(1));
            }

            // 随机渐变角度（0~360度）
            const angle = Math.floor(Math.random() * 360);

            return `
                radial-gradient(ellipse at ${x1}% ${y1}%, ${glow1} 0%, transparent 50%),
                radial-gradient(ellipse at ${x2}% ${y2}%, ${glow2} 0%, transparent 50%),
                linear-gradient(${angle}deg, ${colors.join(', ')})
            `.trim();
        }

        // 页面加载时应用随机背景
        document.addEventListener('DOMContentLoaded', function() {
            const hero = document.querySelector('.hero');
            if (hero) {
                hero.style.background = generateRandomBackground();
                // 固定背景尺寸，与动画兼容（光晕层 100% 100%，渐变层 600% 600% 用于漂移）
                hero.style.backgroundSize = '100% 100%, 100% 100%, 600% 600%';
                // 注意：background-position 由动画控制，无需设置
            }
        });
    </script>

    <!-- ===== 加载子页面内容的脚本 ===== -->
    <script>
        /**
         * 从指定 URL 抓取 HTML，提取 <body> 内的内容并插入到目标容器中。
         */
        function loadAndMerge(url, targetId) {
            const target = document.getElementById(targetId);
            if (!target) return;

            target.innerHTML = '⏳ 正在加载…';
            target.className = 'loading';

            fetch(url, { cache: 'no-cache' })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.text();
                })
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const bodyHTML = doc.body.innerHTML.trim();
                    if (bodyHTML) {
                        target.innerHTML = bodyHTML;
                    } else {
                        target.innerHTML = '📭 该赛场暂无数据';
                    }
                    target.className = '';
                })
                .catch(error => {
                    target.innerHTML = `<span class="error">❌ 加载失败：${error.message}</span>`;
                    target.className = 'error';
                });
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 如果主页面在 https://huangxinyou.github.io/2026summer/
            loadAndMerge('https://huangxinyou.github.io/2026summer/ioi', 'ioi-content');
            loadAndMerge('https://huangxinyou.github.io/2026summer/noi', 'noi-content');
            loadAndMerge('https://huangxinyou.github.io/2026summer/acm', 'acm-content');
        });
    </script>
</head>
<body class="hero font-sans antialiased text-gray-800 py-10">

    <div class="container">
        <!-- 主标题 -->
        <h1 class="text-3xl font-bold">🏆 2026summer</h1>

        <!-- IOI 区域 -->
        <div class="section">
            <h2>IOI:</h2>
            <div id="ioi-content" class="loading">⏳ 正在加载 IOI 数据…</div>
        </div>

        <!-- NOI 区域 -->
        <div class="section">
            <h2>NOI:</h2>
            <div id="noi-content" class="loading">⏳ 正在加载 NOI 数据…</div>
        </div>
        <!-- ACM 区域 -->
        <div class="section">
            <h2>ACM:</h2>
            <div id="acm-content" class="loading">⏳ 正在加载 ACM 数据…</div>
        </div>
    </div>

</body>
</html>
