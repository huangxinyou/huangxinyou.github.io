<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Summer 汇总</title>
    <style>
        /* 你可以替换成你喜欢的样式，保持与原来 all 页面一致即可 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #fafafa;
        }
        h1 {
            font-size: 1.8rem;
            border-bottom: 2px solid #333;
            padding-bottom: 0.3rem;
        }
        .entry {
            display: flex;
            align-items: baseline;
            padding: 0.6rem 0;
            border-bottom: 1px solid #eaeaea;
        }
        .entry .date {
            min-width: 100px;
            color: #555;
            font-size: 0.9rem;
        }
        .entry .title {
            flex: 1;
            margin: 0 1rem;
            text-decoration: none;
            color: #0366d6;
        }
        .entry .title:hover {
            text-decoration: underline;
        }
        .entry .source {
            color: #888;
            font-size: 0.8rem;
            background: #f0f0f0;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 3rem 0;
        }
        .error {
            color: #d73a49;
            background: #ffeef0;
            padding: 1rem;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>📅 2026 Summer 汇总</h1>
    <div id="container">
        <div class="loading" id="loading">正在加载数据...</div>
        <div id="entries"></div>
    </div>

    <script>
        (function() {
            // ---------- 配置区域 ----------
            // 三个子页面的相对路径（与 index.html 在同一目录下）
            const SOURCES = [
                'ioi',
                'noi',
                'acm'
            ];

            // 选择器：根据实际页面结构调整
            const ITEM_SELECTOR = '.entry, li, .item, .post';
            const DATE_SELECTOR = '.date, .time, [datetime], .post-date';
            const TITLE_SELECTOR = 'a, .title, .post-title';

            // ---------- 核心逻辑 ----------
            async function fetchPage(url) {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status} – ${url}`);
                const html = await resp.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const entries = [];

                const items = doc.querySelectorAll(ITEM_SELECTOR);
                for (const item of items) {
                    const dateEl = item.querySelector(DATE_SELECTOR);
                    const titleEl = item.querySelector(TITLE_SELECTOR);
                    if (!dateEl || !titleEl) continue;

                    let dateStr = dateEl.textContent.trim();
                    if (dateEl.hasAttribute('datetime')) {
                        dateStr = dateEl.getAttribute('datetime') || dateStr;
                    }
                    let dateObj = parseDate(dateStr);
                    if (!dateObj) dateObj = null;

                    const title = titleEl.textContent.trim();
                    const link = titleEl.getAttribute('href') || '#';

                    entries.push({
                        date: dateObj,
                        dateDisplay: dateStr,
                        title: title,
                        link: link,
                        source: extractSource(url)
                    });
                }
                return entries;
            }

            function parseDate(str) {
                if (!str) return null;
                str = str.trim();
                let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
                if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
                m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
                if (m) return new Date(+m[3], +m[1] - 1, +m[2]);
                const date = new Date(str);
                if (!isNaN(date)) return date;
                m = str.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
                if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
                return null;
            }

            function extractSource(url) {
                const parts = url.split('/');
                return parts[parts.length - 1] || '未知';
            }

            function render(entries) {
                const container = document.getElementById('entries');
                const loading = document.getElementById('loading');
                if (!entries || entries.length === 0) {
                    container.innerHTML = '<div class="error">没有找到任何条目</div>';
                    loading.style.display = 'none';
                    return;
                }

                entries.sort((a, b) => {
                    if (a.date && b.date) return b.date - a.date;
                    if (a.date) return -1;
                    if (b.date) return 1;
                    return 0;
                });

                let html = '';
                for (const item of entries) {
                    const dateText = item.dateDisplay || '无日期';
                    // 如果链接是相对路径，保留原样；如果是绝对路径则直接使用
                    const link = item.link.startsWith('http') ? item.link : (item.link.startsWith('/') ? item.link : `./${item.link}`);
                    html += `
                        <div class="entry">
                            <span class="date">${dateText}</span>
                            <a href="${link}" class="title" target="_blank">${item.title}</a>
                            <span class="source">${item.source}</span>
                        </div>
                    `;
                }
                container.innerHTML = html;
                loading.style.display = 'none';
            }

            async function loadAll() {
                const loading = document.getElementById('loading');
                try {
                    const results = await Promise.all(SOURCES.map(url => fetchPage(url)));
                    const allEntries = results.flat();
                    render(allEntries);
                } catch (err) {
                    loading.innerHTML = `<div class="error">❌ 加载失败：${err.message}</div>`;
                    console.error(err);
                }
            }

            loadAll();
        })();
    </script>
</body>
</html>
