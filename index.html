<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专题成绩表</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== 原有背景动画 ===== */
        .hero {
            min-height: 100vh;
            animation: bgFlow 10s ease-in-out infinite alternate;
        }

        @keyframes bgFlow {
            0% {
                background-position: 0% 0%, 0% 0%, 0% 0%;
            }
            25% {
                background-position: 0% 0%, 0% 0%, 100% 0%;
            }
            50% {
                background-position: 0% 0%, 0% 0%, 100% 100%;
            }
            75% {
                background-position: 0% 0%, 0% 0%, 0% 100%;
            }
            100% {
                background-position: 0% 0%, 0% 0%, 50% 50%;
            }
        }

        /* ===== 容器 & 基础 ===== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 让所有子元素水平居中 */
            justify-content: center;
            min-height: 100vh;
        }

        /* ===== 标题样式 ===== */
        .main-title {
            font-size: 4rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            margin-bottom: 2.5rem;
            letter-spacing: 4px;
        }

        /* ===== 三个链接容器 ===== */
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3rem;
            /* 链接之间的间距 */
        }

        /* ===== 单个链接样式 ===== */
        .nav-link {
            font-size: 2.25rem;
            /* text-4xl */
            font-weight: 700;
            color: white;
            text-decoration: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 2px;
        }

        /* 链接悬停效果：上浮 + 发光 + 轻微缩放 */
        .nav-link:hover {
            transform: translateY(-4px) scale(1.04);
            color: #f0f9ff;
            text-shadow: 0 6px 24px rgba(255, 255, 255, 0.25);
        }

        /* 链接底部装饰线（悬停时出现） */
        .nav-link::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -4px;
            width: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        .nav-link:hover::after {
            width: 80%;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 640px) {
            .main-title {
                font-size: 2.8rem;
            }
            .nav-link {
                font-size: 1.6rem;
                /* 手机端稍小，但仍然突出 */
                padding: 0.3rem 0.6rem;
            }
            .nav-links {
                gap: 1.5rem;
            }
        }

        @media (max-width: 420px) {
            .main-title {
                font-size: 2.2rem;
            }
            .nav-link {
                font-size: 1.3rem;
            }
            .nav-links {
                gap: 1rem;
                flex-direction: column;
                align-items: center;
            }
        }

        /* ===== 原有评分样式（保留） ===== */
        .score_10 {
            color: forestgreen;
        }
        .score_9 {
            color: #34d034;
        }
        .score_8 {
            color: #41f741;
        }
        .score_7 {
            color: #52ff00;
        }
        .score_6 {
            color: #a5ff00;
        }
        .score_5 {
            color: #c8ff00;
        }
        .score_4 {
            color: #ffd800;
        }
        .score_3 {
            color: #ffa900;
        }
        .score_2 {
            color: #ff6200;
        }
        .score_1 {
            color: #ff4b00;
        }
        .score_0 {
            color: red;
        }
    </style>

    <script>
        /**
         * 生成完全随机的 HSL 颜色（带透明度可选）
         */
        function randomHSL(alpha = 1) {
            const h = Math.floor(Math.random() * 360);
            const s = 40 + Math.floor(Math.random() * 41);
            const l = 50 + Math.floor(Math.random() * 31);
            if (alpha >= 1) return `hsl(${h}, ${s}%, ${l}%)`;
            return `hsla(${h}, ${s}%, ${l}%, ${alpha})`;
        }

        /**
         * 生成完全随机的背景样式（三层叠加）
         */
        function generateRandomBackground() {
            const x1 = 10 + Math.random() * 80;
            const y1 = 10 + Math.random() * 80;
            const x2 = 10 + Math.random() * 80;
            const y2 = 10 + Math.random() * 80;

            const glow1 = randomHSL(0.20 + Math.random() * 0.15);
            const glow2 = randomHSL(0.20 + Math.random() * 0.15);

            const colorCount = 10 + Math.floor(Math.random() * 6);
            const colors = [];
            for (var i = 0; i < colorCount; i++) {
                colors.push(randomHSL(1));
            }

            const angle = Math.floor(Math.random() * 360);

            return `
                radial-gradient(ellipse at ${x1}% ${y1}%, ${glow1} 0%, transparent 50%),
                radial-gradient(ellipse at ${x2}% ${y2}%, ${glow2} 0%, transparent 50%),
                linear-gradient(${angle}deg, ${colors.join(', ')})
            `.trim();
        }

        document.addEventListener('DOMContentLoaded', function() {
            const hero = document.querySelector('.hero');
            if (hero) {
                hero.style.background = generateRandomBackground();
                hero.style.backgroundSize = '100% 100%, 100% 100%, 600% 600%';
            }
        });
    </script>
</head>

<body class="hero font-sans antialiased text-gray-800">

    <div class="container">
        <!-- ===== 标题 ===== -->
        <h1 class="main-title">2026</h1>

        <!-- ===== 三个导航链接：居中 + 变大 ===== -->
        <div class="nav-links">
            <a href="/2026spring" target="_blank" class="nav-link">2026春季</a>
            <a href="/2026summer" target="_blank" class="nav-link">2026暑假</a>
            <a href="/2026autumn" target="_blank" class="nav-link">2026秋季</a>
        </div>
    </div>

</body>
</html>
