<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>综合成绩表</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* ===== 动态背景（流动渐变） ===== */
        .hero {
            min-height: 100vh;
            animation: bgFlow 10s ease-in-out infinite alternate;
        }

        @keyframes bgFlow {
            0% {
                background-position: 0% 0%, 0% 0%, 0% 0%;
            }
            25% {
                background-position: 0% 0%, 0% 0%, 100% 0%;
            }
            50% {
                background-position: 0% 0%, 0% 0%, 100% 100%;
            }
            75% {
                background-position: 0% 0%, 0% 0%, 0% 100%;
            }
            100% {
                background-position: 0% 0%, 0% 0%, 50% 50%;
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== 表格样式 ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
        }

        th {
            background: #2d3748;
            color: white;
            font-weight: 600;
            font-size: 1rem;
        }

        tr:hover {
            background: #f7fafc;
        }

        td a {
            color: #2d3748;
            text-decoration: none;
            font-weight: 500;
        }
        td a:hover {
            text-decoration: underline;
            color: #1a202c;
        }

        h1 {
            color: white;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* ===== 分数颜色（照搬你原来的） ===== */
        .score_10 {
            color: forestgreen;
        }
        .score_9 {
            color: #34d034;
        }
        .score_8 {
            color: #41f741;
        }
        .score_7 {
            color: #52ff00;
        }
        .score_6 {
            color: #a5ff00;
        }
        .score_5 {
            color: #c8ff00;
        }
        .score_4 {
            color: #ffd800;
        }
        .score_3 {
            color: #ffa900;
        }
        .score_2 {
            color: #ff6200;
        }
        .score_1 {
            color: #ff4b00;
        }
        .score_0 {
            color: red;
        }

        .loading-msg,
        .error-msg {
            text-align: center;
            padding: 2rem;
            color: white;
            font-size: 1.2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .error-msg {
            color: #fee2e2;
        }
    </style>

    <script>
        // ===== 随机背景生成（完全照搬你的原版） =====
        function randomHSL(alpha = 1) {
            const h = Math.floor(Math.random() * 360);
            const s = 40 + Math.floor(Math.random() * 41);
            const l = 50 + Math.floor(Math.random() * 31);
            if (alpha >= 1) return `hsl(${h}, ${s}%, ${l}%)`;
            return `hsla(${h}, ${s}%, ${l}%, ${alpha})`;
        }

        function generateRandomBackground() {
            const x1 = 10 + Math.random() * 80;
            const y1 = 10 + Math.random() * 80;
            const x2 = 10 + Math.random() * 80;
            const y2 = 10 + Math.random() * 80;
            const glow1 = randomHSL(0.20 + Math.random() * 0.15);
            const glow2 = randomHSL(0.20 + Math.random() * 0.15);
            const colorCount = 10 + Math.floor(Math.random() * 6);
            const colors = [];
            for (let i = 0; i < colorCount; i++) {
                colors.push(randomHSL(1));
            }
            const angle = Math.floor(Math.random() * 360);
            return `
                radial-gradient(ellipse at ${x1}% ${y1}%, ${glow1} 0%, transparent 50%),
                radial-gradient(ellipse at ${x2}% ${y2}%, ${glow2} 0%, transparent 50%),
                linear-gradient(${angle}deg, ${colors.join(', ')})
            `.trim();
        }

        document.addEventListener('DOMContentLoaded', function () {
            const hero = document.querySelector('.hero');
            if (hero) {
                hero.style.background = generateRandomBackground();
                hero.style.backgroundSize = '100% 100%, 100% 100%, 600% 600%';
            }
        });
    </script>
</head>

<body class="hero font-sans antialiased text-gray-800 py-10">

    <div class="container">
        <!-- 统一的标题 -->
        <h1 class="text-4xl font-bold">🏆 2026 赛季综合成绩表</h1>

        <!-- 统一的表格 -->
        <table>
            <thead>
                <tr>
                    <th>📅 算法（日期）/日期</th>
                    <th>📊 题数</th>
                    <th>🏅 排名</th>
                    <th>📝 补题</th>
                    <th>🏷️ 赛季</th>
                </tr>
            </thead>
            <tbody id="unified-body">
                <tr>
                    <td colspan="5" class="loading-msg">⏳ 正在加载全部赛季数据…</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        (function () {
            // ---------- 配置：三个赛季页面的 URL ----------
            const SEASONS = [
                { url: '2026spring', label: '🌸 春季' },
                { url: '2026summer', label: '☀️ 暑假' },
                { url: '2026autumn', label: '🍂 秋季' }
            ];

            // ---------- 工具函数 ----------
            // 提取 8 位数字日期 (YYYYMMDD)
            function extractDate(text) {
                const m = text.match(/\b(\d{8})\b/);
                return m ? m[1] : null;
            }

            function parseDateStr(str) {
                if (!str) return null;
                const year = parseInt(str.substring(0, 4), 10);
                const month = parseInt(str.substring(4, 6), 10) - 1;
                const day = parseInt(str.substring(6, 8), 10);
                if (!isNaN(year) && !isNaN(month) && !isNaN(day)) {
                    return new Date(year, month, day);
                }
                return null;
            }

            async function fetchPage(url) {
                const resp = await fetch(url, { cache: 'no-cache' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status} – ${url}`);
                return await resp.text();
            }

            // ---------- 核心：从赛季页面的 HTML 中解析出数据行 ----------
            function parseSeasonPage(html, seasonLabel) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // 找到页面里的表格 body
                const tbody = doc.querySelector('#table-body');
                if (!tbody) return [];

                const rows = tbody.querySelectorAll('tr');
                const entries = [];

                for (const row of rows) {
                    // 跳过“加载中”的那一行（它有 id="loading-row"）
                    if (row.id === 'loading-row') continue;

                    const cells = row.querySelectorAll('td');
                    if (cells.length < 4) continue;

                    const col1Text = cells[0].textContent.trim();
                    const dateStr = extractDate(col1Text);
                    if (!dateStr) continue; // 没有日期就跳过

                    const dateObj = parseDateStr(dateStr);

                    // 保留各列的 innerHTML（保留样式、链接等）
                    entries.push({
                        dateObj: dateObj,
                        dateStr: dateStr,
                        col1: cells[0].innerHTML.trim(),
                        col2: cells[1].innerHTML.trim(),
                        col3: cells[2].innerHTML.trim(),
                        col4: cells[3].innerHTML.trim(),
                        season: seasonLabel
                    });
                }
                return entries;
            }

            // ---------- 主流程：加载所有赛季，合并排序后渲染 ----------
            async function loadAllSeasons() {
                const tbody = document.getElementById('unified-body');

                try {
                    // 并行抓取三个赛季页面
                    const results = await Promise.all(
                        SEASONS.map(async (s) => {
                            try {
                                const html = await fetchPage(s.url);
                                const entries = parseSeasonPage(html, s.label);
                                return entries;
                            } catch (err) {
                                console.warn(`加载 ${s.url} 失败:`, err);
                                return [];
                            }
                        })
                    );

                    // 合并所有条目
                    let allEntries = [];
                    results.forEach((entries) => (allEntries = allEntries.concat(entries)));

                    // 按日期降序排序（最新在前）
                    allEntries.sort((a, b) => {
                        if (a.dateObj && b.dateObj) return b.dateObj - a.dateObj;
                        if (a.dateObj) return -1;
                        if (b.dateObj) return 1;
                        return 0;
                    });

                    // 生成表格行 HTML
                    let rowsHTML = '';
                    if (allEntries.length === 0) {
                        rowsHTML =
                            `<tr><td colspan="5" style="text-align:center; padding:2rem; color:#666;">📭 没有找到任何比赛记录</td></tr>`;
                    } else {
                        for (const item of allEntries) {
                            rowsHTML += `
                                <tr>
                                    <td>${item.col1}</td>
                                    <td>${item.col2}</td>
                                    <td>${item.col3}</td>
                                    <td>${item.col4}</td>
                                    <td>${item.season}</td>
                                </tr>
                            `;
                        }
                    }

                    tbody.innerHTML = rowsHTML;
                } catch (err) {
                    tbody.innerHTML =
                        `<tr><td colspan="5" style="text-align:center; padding:2rem; color:red;">❌ 加载失败：${err.message}</td></tr>`;
                    console.error(err);
                }
            }

            // 页面加载完成后执行
            document.addEventListener('DOMContentLoaded', loadAllSeasons);
        })();
    </script>

</body>
</html>
